LABEL cos64
TEXT HELP
Boot the DeftOS install medium on BIOS.
It allows you to install DeftOS or perform system maintenance.
ENDTEXT
MENU LABEL DeftOS default (x86_64, BIOS)
LINUX /arch/boot/x86_64/vmlinuz-linux-cachyos-lts
INITRD /arch/boot/x86_64/initramfs-linux-cachyos-lts.img
APPEND archisobasedir=arch archisosearchuuid=2026-08-09-15-47-03-00 cow_spacesize=10G copytoram=auto module_blacklist=pcspkr i915.modeset=1 amdgpu.modeset=1 nvme_load=yes

# Fallback (nomodeset)
LABEL cos64fb
TEXT HELP
Boot the DeftOS install medium on Bios in fallback mode
It allows you to install DeftOS or perform system maintenance.
ENDTEXT
MENU LABEL DeftOS Fallback (nomodeset, BIOS)
LINUX /arch/boot/x86_64/vmlinuz-linux-cachyos-lts
INITRD /arch/boot/x86_64/initramfs-linux-cachyos-lts.img
APPEND archisobasedir=arch archisosearchuuid=2026-08-09-15-47-03-00 cow_spacesize=10G copytoram=auto module_blacklist=nvidia,nvidia_modeset,nvidia_uvm,nvidia_drm,pcspkr nomodeset nvme_load=yes
