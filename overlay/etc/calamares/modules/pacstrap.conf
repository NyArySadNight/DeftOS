#
### pacstrap Module
#
# This module installs the base system and then copies files
# into the installation that will be used in the installed system
#

---
# basePackages is an array of package names to pass to pacstrap
#
basePackages:
  - base
  - base-devel
  - btrfs-progs
  - cachyos-hooks
  - cachyos-keyring
  - cachyos-mirrorlist
  - cachyos-v4-mirrorlist
  - cachyos-v3-mirrorlist
  - cachyos-rate-mirrors
  - cryptsetup
  - device-mapper
  - diffutils
  - dosfstools
  - e2fsprogs
  - efibootmgr
  - exfatprogs
  - f2fs-tools
  - inetutils
  - jfsutils
  - less
  - linux-firmware
  - logrotate
  - lsb-release
  - lvm2
  - man-db
  - man-pages
  - mdadm
  - chwd
  - mkinitcpio
  - netctl
  - sudo
  - sysfsutils
  - usbutils
  - which
  - xfsprogs

#
# postInstallFiles is an array of file names which will be copied into the system
#
# The paths should be relative to the host and the files will be copied to the
# location in the installed system
#
postInstallFiles:
  - "/etc/mkinitcpio.conf"
  - "/usr/local/bin/dmcheck"
  - "/usr/local/bin/remove-nvidia"
  - "/etc/calamares/scripts/enable-ufw"
  - "/etc/calamares/scripts/bootloader-post-setup"
  - "/etc/calamares/scripts/shell-setup"
  - "/etc/calamares/scripts/btrfs-installation-snapshot"
  - "/usr/share/deftos/branding/os-release"
  - "/usr/share/deftos/branding/lsb-release"
  - "/usr/share/deftos/branding/issue"
  - "/usr/share/deftos/branding/issue.net"
  - "/usr/share/deftos/hooks/restore-branding.sh"
  - "/etc/pacman.d/hooks/99-deftos-branding.hook"
  - "/usr/share/deftos/logo.txt"
  - "/usr/share/wallpapers/DeftOSHole.jpg"
  - "/etc/xdg/fastfetch/config.jsonc"
  - "/etc/xdg/fastfetch/deftos_logo.txt"
  - "/etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc"
  - "/usr/lib/deftos/snapper-init.sh"
  - "/usr/lib/systemd/system/deftos-snapper-init.service"
  - "/etc/skel/.bashrc"
  - "/etc/skel/.zshrc"
