#
# Chuan bi he thong dich truoc pacstrap. pacman-more.conf tro toi cac mirrorlist
# cua CachyOS; cac file nay chi co trong package, nen phai copy tu live truoc,
# neu khong pacstrap se loi "config file ... could not be read".
---
dontChroot: false
timeout: 900
script:
  - "cp /etc/pacman-more.conf @@ROOT@@/etc/pacman.conf"
  - "/etc/calamares/scripts/detect-architecture @@ROOT@@/etc/pacman.conf"
  - "mkdir -p @@ROOT@@/etc/pacman.d"
  - "cp -n /etc/pacman.d/cachyos-mirrorlist /etc/pacman.d/cachyos-v3-mirrorlist /etc/pacman.d/cachyos-v4-mirrorlist @@ROOT@@/etc/pacman.d/"
