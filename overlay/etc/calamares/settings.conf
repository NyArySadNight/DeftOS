---
modules-search: [ local ]

instances:
- id:       shellprocess_branding
  module:   shellprocess
  config:   shellprocess_branding.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
  # Removed CPU/GPU selection modules
- exec:
  - partition
  - mount
  - pacstrap
  - shellprocess@shellprocess_branding
  - machineid
  - users
  - locale
  - keyboard
  - localecfg
  - chwd
  - fstab
  - grubcfg
  - bootloader
  - services-systemd
  - initcpiocfg
  - initcpio
  - networkcfg
  - umount
- show:
  - finished

branding: deftos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
