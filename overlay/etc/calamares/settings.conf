---
# DeftOS Calamares Configuration
# Minimal, clean installer flow

branding: deftos
prompt-install: true
dont-chroot: false
oem-setup: false

disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false

# Module search paths
modules-search: [ local ]

# Custom module instances
instances:
- id:       shellprocess_branding
  module:   shellprocess
  config:   shellprocess_branding.conf

# Installer sequence - ONLY these steps shown and executed
sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary

- exec:
  - partition
  - mount
  - pacstrap
  - shellprocess@shellprocess_branding
  - machineid
  - users
  - locale
  - keyboard
  - localecfg
  - chwd
  - fstab
  - grubcfg
  - bootloader
  - services-systemd
  - initcpiocfg
  - initcpio
  - networkcfg
  - umount

- show:
  - finished
